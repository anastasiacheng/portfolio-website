<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
body { margin: 0; width: 960px; height: 660px; overflow: hidden; font-family: Arimo, sans-serif;
  background: radial-gradient(circle at 20% 15%, #ffe3ec 0, transparent 45%), radial-gradient(circle at 85% 80%, #dff1ff 0, transparent 50%), #fffaf3; }
.booth { position: absolute; left: 70px; top: 80px; width: 330px; height: 470px; border-radius: 26px; background: #111; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
.screen { position: absolute; left: 30px; top: 30px; right: 30px; height: 280px; border-radius: 14px;
  background: linear-gradient(135deg, #ff8fab, #ffc46b 45%, #7ad7f0); }
.screen::after { content: ""; position: absolute; left: 50%; top: 52%; width: 120px; height: 150px; transform: translate(-50%, -50%);
  border-radius: 60px 60px 40px 40px; background: rgba(255,255,255,.35); }
.label { position: absolute; left: 0; right: 0; top: 318px; text-align: center; color: #fff; font-family: "Reenie Beanie"; font-size: 44px; }
.shutter { position: absolute; left: 50%; bottom: 26px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; background: #ff5d73; border: 6px solid #fff; }
.print { position: absolute; width: 190px; padding: 14px 14px 52px; background: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.16); }
.print div { height: 170px; }
.print span { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: "Reenie Beanie"; font-size: 30px; }
.p1 { left: 445px; top: 60px; transform: rotate(-8deg); } .p1 div { background: linear-gradient(160deg, #ffb3c6, #ffd6a5); }
.p2 { left: 690px; top: 95px; transform: rotate(6deg); } .p2 div { background: linear-gradient(160deg, #a0e7e5, #b4f8c8); filter: sepia(.4); }
.p3 { left: 560px; top: 335px; transform: rotate(-3deg); } .p3 div { background: linear-gradient(160deg, #cdb4db, #bde0fe); filter: grayscale(.6); }
</style></head>
<body>
<div class="booth"><div class="screen"></div><div class="label">say cheese!</div><div class="shutter"></div></div>
<div class="print p1"><div></div><span>take one</span></div>
<div class="print p2"><div></div><span>vintage</span></div>
<div class="print p3"><div></div><span>b &amp; w</span></div>
</body></html>
